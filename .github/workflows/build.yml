# Builds an IPA to re-sign on the device (build-system/WGBuildResign.sh) on a GitHub-hosted Mac.
#
# Run it in your own fork: Actions → "Build IPA for re-signing" → Run workflow. The IPA is uploaded as
# a workflow artifact (kept for a few days), never as a release. See docs/ios/building.md.
#
# Required secrets: TELEGRAM_API_ID and TELEGRAM_API_HASH from https://my.telegram.org.
# Device builds must never silently fall back to Telegram's public API credentials.

name: Build IPA for re-signing

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Your reverse-DNS bundle ID, e.g. com.froggram.ios"
        required: true
      build_number:
        description: "Build number"
        required: true
        default: "1"
      runner:
        description: "Runner label; it must have the Xcode version from versions.json"
        required: true
        default: "xcode-27"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate device build configuration
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          api_id = os.environ.get("API_ID", "").strip()
          api_hash = os.environ.get("API_HASH", "").strip()
          bundle_id = os.environ.get("BUNDLE_ID", "").strip()
          errors = []
          if not api_id or not api_hash:
              errors.append("Set both TELEGRAM_API_ID and TELEGRAM_API_HASH in Settings → Secrets and variables → Actions (from https://my.telegram.org).")
          elif not api_id.isdigit() or not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
              errors.append("Telegram API credentials have an invalid format; check the values from my.telegram.org.")
          if not re.fullmatch(r"[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)+", bundle_id):
              errors.append("bundle_id must be a reverse-DNS identifier, e.g. com.froggram.ios.")
          if bundle_id == "ph.telegra.Telegraph":
              errors.append("Do not use Telegram's bundle ID.")
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print(f"Validated bundle ID: {bundle_id}")
          PY

      - name: Select the Xcode from versions.json
        run: |
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::$XCODE_PATH is not on this runner. Installed: $(echo /Applications/Xcode_*.app)"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          if [ -L /Applications/Xcode.app ] || [ ! -e /Applications/Xcode.app ]; then
            sudo ln -sfn "$XCODE_PATH" /Applications/Xcode.app
          fi
          echo "XCODE_PATH=$XCODE_PATH" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Free disk space
        run: |
          df -h /
          for xcode in /Applications/Xcode_*.app; do
            [ "$(cd "$xcode" && pwd -P)" = "$(cd "$XCODE_PATH" && pwd -P)" ] || sudo rm -rf "$xcode"
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" "$HOME/hostedtoolcache" || true
          df -h /

      - name: Write the configuration
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open("build-system/wraithgram-configuration.example.json"))
          config.pop("_warning", None)
          config["api_id"] = os.environ["API_ID"].strip()
          config["api_hash"] = os.environ["API_HASH"].strip()
          config["bundle_id"] = os.environ["BUNDLE_ID"].strip()
          json.dump(config, open("build-system/wraithgram-configuration.json", "w"), indent=2)
          PY

      - name: Build
        env:
          WG_BAZEL_CACHE: ""
          WG_BUILD_LOG: ${{ runner.temp }}/wg-build.log
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: build-system/WGBuildResign.sh "$BUILD_NUMBER"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: FrogGram-for-resign-${{ inputs.build_number }}
          path: build-output/ipa/Wraithgram-for-resign.ipa
          retention-days: 3
          if-no-files-found: error

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/wg-build.log
          retention-days: 3
          if-no-files-found: ignore
